name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify released commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate
        run: |
          go vet ./...
          go test ./...
      - name: Build Linux archives and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release.sh "$RELEASE_TAG"
      - name: Publish a new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "dist/release-$version/"*.tar.gz "dist/release-$version/checksums.txt"
